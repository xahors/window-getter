name: Build AppImage

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag/version for release (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            xvfb

      - name: Install Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Pytest Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/

  build-appimage:
    name: Build Linux AppImage
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            file \
            wget

      - name: Install Python Build Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pyinstaller build

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller \
            --noconfirm \
            --onedir \
            --name window-getter \
            --add-data "window_getter/web/static:window_getter/web/static" \
            --collect-all PyQt6 \
            window_getter/cli.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/metainfo
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          # Copy pyinstaller binary and runtime bundle
          cp -r dist/window-getter/* AppDir/usr/bin/

          # Copy Desktop Entry, AppStream Metadata, and Icons
          cp assets/window-getter.desktop AppDir/
          cp assets/window-getter.desktop AppDir/usr/share/applications/
          cp assets/window-getter.appdata.xml AppDir/usr/share/metainfo/
          cp assets/window-getter.png AppDir/
          cp assets/window-getter.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp assets/window-getter.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          # Create AppRun entrypoint script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/window-getter" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package AppImage with appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir window-getter-x86_64.AppImage
          chmod +x window-getter-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: window-getter-x86_64.AppImage
          path: window-getter-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Build Python Source Distribution and Wheel
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        run: |
          python3 -m build

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          name: "Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          files: |
            window-getter-x86_64.AppImage
            dist/*.tar.gz
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
