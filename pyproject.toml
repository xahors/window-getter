[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "window-getter"
version = "1.0.0"
description = "Linux active window inspector and task manager with Hyprland, Sway, and X11 support."
readme = "README.md"
authors = [{ name = "Antigravity Team" }]
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.0.0",
]

[project.scripts]
window-getter = "window_getter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["window_getter*"]

[tool.setuptools.package-data]
"window_getter.web" = ["static/*"]
